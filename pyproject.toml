[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digester-worker"
version = "0.1.0"
description = "Worker service for processing images with MediaPipe"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=0.10.30",
    "aio-pika>=9.4.0",
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
digester-worker = "src.main:run"

[tool.pytest.ini_options]
pythonpath = ["."]
